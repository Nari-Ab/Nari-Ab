name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#EBEDF0,#E9D5FF,#C084FC,#A855F7,#7E22CE
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#3B1D6B,#6B21A8,#9333EA,#A855F7

      - name: Complete last column to full 7-row height
        run: |
          sudo chmod -R 777 dist
          node -e '
            const fs = require("fs");
            for (const file of ["dist/contribution-snake.svg", "dist/contribution-snake-dark.svg"]) {
              if (!fs.existsSync(file)) continue;
              let svg = fs.readFileSync(file, "utf8");
              const regex = /<rect class="c[^"]*" x="(\d+)" y="(\d+)" rx="2" ry="2"\/>/g;
              let match;
              let maxX = 0;
              const colY = {};
              while ((match = regex.exec(svg)) !== null) {
                const x = parseInt(match[1]);
                const y = parseInt(match[2]);
                if (x > maxX) maxX = x;
                if (!colY[x]) colY[x] = new Set();
                colY[x].add(y);
              }
              const allY = [2, 18, 34, 50, 66, 82, 98];
              let extra = "";
              for (const y of allY) {
                if (!colY[maxX] || !colY[maxX].has(y)) {
                  extra += `<rect class="c" x="${maxX}" y="${y}" rx="2" ry="2"/>`;
                }
              }
              if (extra) {
                const searchTarget = new RegExp(`(<rect class="c[^"]*" x="${maxX}" y="\\d+" rx="2" ry="2"\\/>)`);
                svg = svg.replace(searchTarget, `$1${extra}`);
                fs.writeFileSync(file, svg, "utf8");
              }
            }
          '

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
