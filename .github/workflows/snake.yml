name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#EBEDF0,#E9D5FF,#C084FC,#A855F7,#7E22CE
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#3B1D6B,#6B21A8,#9333EA,#A855F7

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
